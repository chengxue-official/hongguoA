<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红果TV · 日志查看</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #0e1116; color: #e6e8eb;
         font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #9aa4b2; font-size: 12px; margin-bottom: 16px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  input, select, button { background: #161b22; color: #e6e8eb; border: 1px solid #30363d;
         border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  input { min-width: 260px; flex: 1; }
  button { cursor: pointer; }
  button:hover { border-color: #e5484d; color: #ff8a8f; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #21262d; vertical-align: top; }
  th { color: #9aa4b2; font-weight: 500; font-size: 12px; }
  tr:hover td { background: #131820; }
  a { color: #7cb0ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px;
         background: #1d2531; color: #9aa4b2; font-size: 11px; margin-left: 6px; }
  .diag { color: #7bd88f; }
  .warn { color: #ffb86b; }
  .err { color: #ff6b6b; }
  #msg { color: #9aa4b2; font-size: 12px; margin: 10px 0; min-height: 18px; }
  .dev { font-weight: 600; }
  .head { color: #6e7681; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>红果TV · 日志查看</h1>
<div class="sub">只读。点开单条可看全文 / 复制 / 下载。key 由管理员分配。</div>

<div class="bar">
  <input id="key" placeholder="诊断 key（形如 hgdiag_xxxx，可放在 ?key= 里）">
  <select id="days">
    <option value="1">今天</option>
    <option value="3" selected>近 3 天</option>
    <option value="7">近 7 天</option>
  </select>
  <input id="q" placeholder="搜设备名 / 时间 / 内容关键词" style="min-width:200px">
  <button id="load">刷新列表</button>
</div>

<div id="msg"></div>
<table id="tbl" hidden>
  <thead>
    <tr><th style="width:150px">时间</th><th style="width:230px">设备</th>
        <th style="width:90px">大小</th><th>开头 / 对拍结论</th><th style="width:80px">操作</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const $ = (id) => document.getElementById(id);
const msg = (t, cls) => { const m = $('msg'); m.textContent = t || ''; m.className = cls || ''; };

function keyFromUrl() {
  const u = new URL(location.href);
  const k = u.searchParams.get('key');
  if (k) $('key').value = k;
}

function verdict(head) {
  if (!head) return '';
  if (head.includes('===== 取流对拍 =====')) {
    const seg = head.split('===== 取流对拍 =====')[1] || '';
    const ok = (seg.match(/OK/g) || []).length;
    const empty = (seg.match(/EMPTY/g) || []).length;
    if (ok === 0) return '<span class="err">对拍 ' + empty + ' 条全空 → 设备/身份问题</span>';
    if (empty === 0) return '<span class="diag">对拍全通</span>';
    return '<span class="warn">对拍 ' + ok + ' 通 / ' + empty + ' 空</span>';
  }
  if (head.includes('空 body') || head.includes('len=0')) return '<span class="warn">有空包</span>';
  return '';
}

async function load() {
  const key = $('key').value.trim();
  if (!key) { msg('先填 key', 'warn'); return; }
  history.replaceState(null, '', '?key=' + encodeURIComponent(key));
  msg('加载中…');
  const url = '/api/diag/recent?key=' + encodeURIComponent(key)
    + '&days=' + $('days').value + '&limit=200'
    + '&q=' + encodeURIComponent($('q').value.trim());
  try {
    const r = await fetch(url, { headers: { 'Cache-Control': 'no-cache' } });
    const data = await r.json();
    if (data.code !== 0) { msg('key 无效或已吊销（' + (data.msg || data.code) + '）', 'err'); return; }
    const tbody = $('tbl').querySelector('tbody');
    tbody.innerHTML = '';
    if (!data.logs.length) { msg('这段时间没有日志'); $('tbl').hidden = true; return; }
    for (const it of data.logs) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + (it.time || it.day) + '</td>' +
        '<td><span class="dev">' + (it.device || '未知设备') + '</span></td>' +
        '<td>' + Math.round((it.size || 0) / 1024) + ' KB</td>' +
        '<td>' + verdict(it.head) + '<div class="head">' +
            (it.head || '').slice(0, 180).replace(/[<>&]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) +
        '</div></td>' +
        '<td><a href="/log/' + it.token + '" target="_blank" rel="noopener">打开</a></td>';
      tbody.appendChild(tr);
    }
    $('tbl').hidden = false;
    msg('共 ' + data.total + ' 条，显示 ' + data.returned + ' 条');
  } catch (e) {
    msg('请求失败：' + e.message, 'err');
  }
}

$('load').onclick = load;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
keyFromUrl();
if ($('key').value) load();
</script>
</body>
</html>
